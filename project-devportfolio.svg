  <text x="218" y="232" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Learning • Building • Growing</text>

  <!-- Buttons Mock -->
  <rect x="175" y="260" width="115" height="34" rx="8" fill="url(#brandGradient)" />
  <text x="232" y="281" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">View Projects</text>

  <rect x="305" y="260" width="120" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="365" y="281" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Get In Touch</text>

  <!-- Code watermark in corner -->
  <text x="50" y="320" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569" opacity="0.6">&lt;glassmorphism-ui /&gt;</text>
