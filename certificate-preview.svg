<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="certMesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Outer Certificate Card -->
  <rect width="800" height="560" rx="20" fill="url(#certBg)" stroke="#334155" stroke-width="3" />
  <rect width="800" height="560" rx="20" fill="url(#certMesh)" />

  <!-- Inner Gold Decorative Border -->
  <rect x="30" y="30" width="740" height="500" rx="14" fill="none" stroke="url(#certBorder)" stroke-width="3" stroke-dasharray="16 8" />
  <rect x="42" y="42" width="716" height="476" rx="10" fill="none" stroke="#64748b" stroke-width="1" />

  <!-- Header / Badge -->
  <g transform="translate(400, 110)">
    <circle cx="0" cy="0" r="38" fill="#1e1b4b" stroke="url(#certBorder)" stroke-width="2" />
    <!-- Ribbon stars / medal -->
    <path d="M 0 -18 L 5 -5 L 18 -5 L 8 4 L 12 18 L 0 10 L -12 18 L -8 4 L -18 -5 L -5 -5 Z" fill="#f59e0b" />
  </g>

  <text x="400" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#f59e0b">CERTIFICATE OF COMPLETION</text>
  <text x="400" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">THIS IS PROUDLY PRESENTED TO</text>
  
  <text x="400" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">DIVYANSHU JAIN</text>
  <line x1="240" y1="280" x2="560" y2="280" stroke="#6366f1" stroke-width="2" />

  <text x="400" y="320" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#cbd5e1">
    For successfully mastering foundational concepts in
  </text>
  <text x="400" y="350" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">
    [Course / Specialization Title Placeholder]
  </text>

  <text x="400" y="390" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Issued by [Issuing Academy / Organization Placeholder] • Verified Credential
  </text>

  <!-- Signatures / Credential ID Bar -->
  <line x1="100" y1="460" x2="280" y2="460" stroke="#475569" stroke-width="1.5" />
  <text x="190" y="480" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Verified Program Director</text>

  <rect x="310" y="445" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="468" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">ID: DJ-CERT-2024-XXXX</text>

  <line x1="520" y1="460" x2="700" y2="460" stroke="#475569" stroke-width="1.5" />
  <text x="610" y="480" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Academic Advisory Board</text>
</svg>
