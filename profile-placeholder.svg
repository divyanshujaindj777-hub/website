<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Outer Glowing Tech Ring -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-dasharray="8 6" opacity="0.85" filter="url(#glow)" />
  <circle cx="200" cy="180" r="125" fill="none" stroke="url(#accentGlow)" stroke-width="1.5" opacity="0.4" />

  <!-- Avatar Silhouette / Stylized Portrait -->
  <!-- Shoulders & Torso -->
  <path d="M 110 320 C 110 260, 150 240, 200 240 C 250 240, 290 260, 290 320 Z" fill="#1e293b" stroke="url(#primaryGlow)" stroke-width="2" />
  <!-- Inner Hoodie / Collar line -->
  <path d="M 165 245 L 200 295 L 235 245" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Head / Face Silhouette -->
  <circle cx="200" cy="170" r="55" fill="#334155" stroke="url(#primaryGlow)" stroke-width="2.5" />

  <!-- Futuristic Monogram / Tech Badge -->
  <text x="200" y="182" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2">DJ</text>

  <!-- Code brackets indicator -->
  <text x="142" y="178" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#06b6d4" opacity="0.8">&lt;</text>
  <text x="258" y="178" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#06b6d4" opacity="0.8">/&gt;</text>

  <!-- Active Status Indicator Dot -->
  <circle cx="270" cy="270" r="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />
  <circle cx="270" cy="270" r="9" fill="#10b981" />
  <circle cx="270" cy="270" r="12" fill="none" stroke="#10b981" opacity="0.5">
    <animate attributeName="r" values="9;16;9" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom Tag Bar -->
  <rect x="75" y="345" width="250" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="200" y="366" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
    B.TECH CSE • AI/ML DEV
  </text>
</svg>
